name: code-reviewer-ai

# `docker compose up` brings up the ENTIRE stack with one command:
# Postgres, Redis, the Rails API, a Sidekiq worker, and the React SPA.
# The Rails API talks to DeepSeek (cloud LLM) — see backend/.env — so no
# local Ollama server is required.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cra
      POSTGRES_PASSWORD: cra
      POSTGRES_DB: code_reviewer_ai_development
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cra"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: code-reviewer-ai-backend:dev
    env_file: ./backend/.env
    environment:
      # Override host/URL so the container reaches services by their
      # compose network name rather than the host-oriented values in .env.
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"
    volumes:
      # backend (writer of uploaded blobs) and sidekiq (reader, in IngestJob)
      # are separate containers — without this shared volume each has its own
      # private /rails/storage and the worker can never see what the API wrote.
      - submission_storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    image: code-reviewer-ai-backend:dev
    env_file: ./backend/.env
    environment:
      DATABASE_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - submission_storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # These are consumed by the browser (host machine), so they point at
      # the published host ports, not container-internal service names.
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_WS_BASE_URL: ws://localhost:3000/cable
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
  submission_storage:
